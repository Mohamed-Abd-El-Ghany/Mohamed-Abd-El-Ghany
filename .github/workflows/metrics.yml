name: Profile metrics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # A personal token (secret METRICS_TOKEN) also counts private work.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Mohamed-Abd-El-Ghany
          filename: metrics.svg
          template: classic
          base: activity, community, repositories
          config_timezone: Africa/Cairo
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
